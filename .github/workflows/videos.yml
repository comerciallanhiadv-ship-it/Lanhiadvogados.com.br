name: Atualizar vídeos do YouTube
on:
  schedule:
    - cron: '17 */6 * * *'   # a cada 6 horas
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: videos, cancel-in-progress: false }
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pillow
      - run: python3 .github/scripts/videos.py
      - name: Publicar se mudou
        run: |
          git add videos.json img/yt || true
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git config user.name "atualizador-videos"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Vídeos do YouTube atualizados"
          git push
