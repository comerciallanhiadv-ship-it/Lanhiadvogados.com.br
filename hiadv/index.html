<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>O HiAdv mudou de endereço</title>
<meta http-equiv="refresh" content="0; url=https://hiadv.com.br/">
<script>try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(/\/(equipe|hiadv)\/$/.test(new URL(r.scope).pathname))r.unregister()})})}catch(e){}location.replace('https://hiadv.com.br/');</script>
</head><body style="font-family:system-ui,sans-serif;padding:24px;line-height:1.5">
<p>O HiAdv agora fica em hiadv.com.br. <a href="https://hiadv.com.br/">Abrir o HiAdv</a>.</p>
</body></html>
